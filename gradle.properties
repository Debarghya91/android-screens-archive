# preferIPv4Stack: the Gradle daemon binds its loopback listener
# to 127.0.0.1, and on a dual-stack JVM that becomes an
# IPv4-mapped IPv6 socket whose accept() never fires in sandboxed
# networks (verified by strace, 13 Nov 2026). Forcing the IPv4
# stack gives the daemon a pure IPv4 listener. Harmless on
# normal machines. On VMs whose egress proxy is IPv6-only,
# Gradle's proxy traffic must go through a local IPv4
# forwarder; see README.md.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
# Same loopback fix for the Kotlin compile daemon, which is a
# separate JVM process with its own socket listener: without it
# the daemon binds an IPv4-mapped IPv6 socket and the Gradle
# worker can never connect ("Could not connect to Kotlin compile
# daemon"). Harmless on normal machines.
kotlin.daemon.jvm.options=-Djava.net.preferIPv4Stack=true
# In-process Kotlin compilation: the Kotlin daemon talks to the
# Gradle worker over a loopback TCP socket, and sandboxed JVM
# loopback is broken in both directions (see above), so daemon
# compilation cannot connect at all. In-process compilation runs
# the compiler inside the Gradle worker JVM: no socket, and one
# fewer JVM, which also suits low-memory machines.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.2.2 was tested up to compileSdk 34 and warns on 36; the
# warning is suppressed because the SDK 36 build is verified green
# on this toolchain (probe build 14 Nov 2026, BUILD SUCCESSFUL),
# and Play requires targetSdk 36 for new apps and updates since
# 31 Aug 2026. Revisit when AGP is next upgraded.
android.suppressUnsupportedCompileSdk=36
