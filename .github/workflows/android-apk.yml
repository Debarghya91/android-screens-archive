name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore sideload keystore
        shell: bash
        run: echo "${{ secrets.ANDROID_SIDELOAD_KEYSTORE_B64 }}" | base64 --decode > "$GITHUB_WORKSPACE/../persistent-sideload.keystore"
      - name: Diagnose restored keystore
        run: |
          ls -l "$GITHUB_WORKSPACE/../persistent-sideload.keystore"
          sha256sum "$GITHUB_WORKSPACE/../persistent-sideload.keystore"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/../persistent-sideload.keystore" -storepass android | grep -E "Alias name|SHA256:"
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleQa --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/qa/*.apk
          if-no-files-found: error
